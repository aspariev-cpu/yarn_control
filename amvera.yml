meta:
  environment: node
  toolchain:
    name: npm
    version: 18

build:
  # Здесь выполняем сборку фронтенда (React) и генерацию Prisma
  additionalCommands: |
    cd client && npm install && npm run build && cd ..
    npx prisma generate

run:
  # Запускаем сервер (миграции лучше делать вручную или через отдельную команду, 
  # так как run должен просто запускать процесс)
  scriptName: src/index.js
  containerPort: 3000
