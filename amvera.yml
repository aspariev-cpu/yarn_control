meta:
  environment: node
  toolchain:
    name: npm
    version: 18

build:
  # Устанавливаем зависимости и собираем фронтенд без использования cd
  additionalCommands: |
    npm install --prefix client
    npm run build --prefix client
    npx prisma generate

run:
  # Запускаем сервер. Миграции лучше применить один раз вручную (см. ниже)
  scriptName: src/index.js
  containerPort: 3000
